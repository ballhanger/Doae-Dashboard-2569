    <script>
        const MASTER_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRzugFLo6mVzCbdo35AtXw_M7MDRuVbxGPk9oU_Q8n1C0jB1SAMkRtRinn7gUEUS-d_FrcQzbkEKWvx/pub?gid=0&single=true&output=csv";
        let MASTER_INDEX = [];

        const today = new Date();
        const currentMonth = today.getMonth() + 1;
        let currentQuarter = 1;
        let isLastMonthOfQuarter = false;

        // คำนวณไตรมาส
        if (currentMonth >= 10 && currentMonth <= 12) { 
            currentQuarter = 1; isLastMonthOfQuarter = (currentMonth === 12); 
        } else if (currentMonth >= 1 && currentMonth <= 3) { 
            currentQuarter = 2; isLastMonthOfQuarter = (currentMonth === 3); 
        } else if (currentMonth >= 4 && currentMonth <= 6) { 
            currentQuarter = 3; isLastMonthOfQuarter = (currentMonth === 6); 
        } else if (currentMonth >= 7 && currentMonth <= 9) { 
            currentQuarter = 4; isLastMonthOfQuarter = (currentMonth === 9); 
        }

        // Theme ของ KPI (ใช้กับพื้นหลังการ์ดด้านบน และการ์ดโดนัท)
        const kpiColorThemes = [
            { planBg: 'bg-emerald-300', planBorder: 'border-emerald-400', planText: 'text-emerald-700', actBg: 'bg-emerald-500', actBorder: 'border-emerald-600', actText: 'text-emerald-600', legendPlanBg: 'bg-emerald-300', legendActBg: 'bg-emerald-500', cardPlanBg: 'bg-gradient-to-br from-emerald-200 to-emerald-300', cardPlanText: 'text-emerald-900', cardActBg: 'bg-gradient-to-br from-emerald-500 to-emerald-600', cardActText: 'text-white', cardPctBg: 'bg-emerald-50', cardPctText: 'text-emerald-800' },
            { planBg: 'bg-blue-300', planBorder: 'border-blue-400', planText: 'text-blue-700', actBg: 'bg-blue-500', actBorder: 'border-blue-600', actText: 'text-blue-600', legendPlanBg: 'bg-blue-300', legendActBg: 'bg-blue-500', cardPlanBg: 'bg-gradient-to-br from-blue-200 to-blue-300', cardPlanText: 'text-blue-900', cardActBg: 'bg-gradient-to-br from-blue-500 to-blue-600', cardActText: 'text-white', cardPctBg: 'bg-blue-50', cardPctText: 'text-blue-800' },
            { planBg: 'bg-purple-300', planBorder: 'border-purple-400', planText: 'text-purple-700', actBg: 'bg-purple-500', actBorder: 'border-purple-600', actText: 'text-purple-600', legendPlanBg: 'bg-purple-300', legendActBg: 'bg-purple-500', cardPlanBg: 'bg-gradient-to-br from-purple-200 to-purple-300', cardPlanText: 'text-purple-900', cardActBg: 'bg-gradient-to-br from-purple-500 to-purple-600', cardActText: 'text-white', cardPctBg: 'bg-purple-50', cardPctText: 'text-purple-800' },
            { planBg: 'bg-pink-300', planBorder: 'border-pink-400', planText: 'text-pink-700', actBg: 'bg-pink-500', actBorder: 'border-pink-600', actText: 'text-pink-600', legendPlanBg: 'bg-pink-300', legendActBg: 'bg-pink-500', cardPlanBg: 'bg-gradient-to-br from-pink-200 to-pink-300', cardPlanText: 'text-pink-900', cardActBg: 'bg-gradient-to-br from-pink-500 to-pink-600', cardActText: 'text-white', cardPctBg: 'bg-pink-50', cardPctText: 'text-pink-800' },
            { planBg: 'bg-cyan-300', planBorder: 'border-cyan-400', planText: 'text-cyan-700', actBg: 'bg-cyan-500', actBorder: 'border-cyan-600', actText: 'text-cyan-600', legendPlanBg: 'bg-cyan-300', legendActBg: 'bg-cyan-500', cardPlanBg: 'bg-gradient-to-br from-cyan-200 to-cyan-300', cardPlanText: 'text-cyan-900', cardActBg: 'bg-gradient-to-br from-cyan-500 to-cyan-600', cardActText: 'text-white', cardPctBg: 'bg-cyan-50', cardPctText: 'text-cyan-800' },
            { planBg: 'bg-rose-300', planBorder: 'border-rose-400', planText: 'text-rose-700', actBg: 'bg-rose-500', actBorder: 'border-rose-600', actText: 'text-rose-600', legendPlanBg: 'bg-rose-300', legendActBg: 'bg-rose-500', cardPlanBg: 'bg-gradient-to-br from-rose-200 to-rose-300', cardPlanText: 'text-rose-900', cardActBg: 'bg-gradient-to-br from-rose-500 to-rose-600', cardActText: 'text-white', cardPctBg: 'bg-rose-50', cardPctText: 'text-rose-800' },
            { planBg: 'bg-teal-300', planBorder: 'border-teal-400', planText: 'text-teal-700', actBg: 'bg-teal-500', actBorder: 'border-teal-600', actText: 'text-teal-600', legendPlanBg: 'bg-teal-300', legendActBg: 'bg-teal-500', cardPlanBg: 'bg-gradient-to-br from-teal-200 to-teal-300', cardPlanText: 'text-teal-900', cardActBg: 'bg-gradient-to-br from-teal-500 to-teal-600', cardActText: 'text-white', cardPctBg: 'bg-teal-50', cardPctText: 'text-teal-800' }
        ];

        // 🎨 ชุดสีสำหรับ 5 สถานะ (ใช้ตกแต่งวงแหวนโดนัท และป้ายกำกับ)
        const getStatusColorConfig = (status) => {
            if (status.includes("เป็นไปตามแผน")) return { ring: '#10B981', badgeBg: 'bg-[#064E3B]', badgeText: 'text-white', border: 'border-[#047857]', subtext: 'ร้อยละผลงาน ≥ 100' };
            if (status.includes("ล่าช้า")) return { ring: '#EAB308', badgeBg: 'bg-[#CA8A04]', badgeText: 'text-white', border: 'border-[#A16207]', subtext: 'ร้อยละ 50 - 99' }; // ใช้สีเหลืองสดสำหรับความล่าช้า
            if (status.includes("เสี่ยง")) return { ring: '#EF4444', badgeBg: 'bg-[#7F1D1D]', badgeText: 'text-white', border: 'border-[#991B1B]', subtext: 'ต่ำกว่าร้อยละ 50' };
            if (status.includes("ยังไม่ดำเนินการ") || status.includes("ไม่มี")) return { ring: '#1E293B', badgeBg: 'bg-[#0F172A]', badgeText: 'text-white', border: 'border-[#1E293B]', subtext: 'ผลงาน = 0' };
            if (status.includes("มีแผนอยู่ใน")) return { ring: '#94A3B8', badgeBg: 'bg-[#334155]', badgeText: 'text-white', border: 'border-[#475569]', subtext: 'ยังไม่ถึงช่วงแผนงาน' };
            return { ring: '#CBD5E1', badgeBg: 'bg-slate-700', badgeText: 'text-white', border: 'border-slate-800', subtext: '-' };
        };

        const formatMoney = (num) => new Intl.NumberFormat('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num);
        const formatAutoDecimal = (num) => {
            if (num % 1 !== 0) return new Intl.NumberFormat('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num);
            return new Intl.NumberFormat('th-TH').format(num); 
        };

        // สไตล์สถานะในตารางด้านล่าง
        const getStatusStyles = (status) => {
            if (!status) return "bg-slate-100 text-slate-500 border-slate-200";
            if (status.includes("เป็นไปตามแผน")) return "bg-[#D1FAE5] text-[#065F46] border-[#34D399] shadow-sm anim-success";
            if (status.includes("ล่าช้า")) return "bg-[#FEF08A] text-[#854D0E] border-[#FACC15] shadow-sm anim-warning"; 
            if (status.includes("เสี่ยง")) return "bg-[#FEE2E2] text-[#991B1B] border-[#F87171] shadow-md anim-danger font-bold";
            if (status.includes("ยังไม่ดำเนินการ") || status.includes("ไม่มี")) return "bg-[#1E293B] text-white border-[#0F172A] shadow-md anim-critical font-bold tracking-wide";
            if (status.includes("มีแผนอยู่ใน")) return "bg-[#F1F5F9] text-[#475569] border-[#CBD5E1] shadow-sm border font-bold";
            return "bg-slate-100 text-slate-600 border-slate-200";
        };

        const getBadgeColor = (actual, plan) => {
            if (plan === 0 && actual === 0) return 'bg-slate-200 text-slate-600 border-slate-300'; 
            const pct = plan > 0 ? (actual / plan) * 100 : (actual > 0 ? 100 : 0);
            if (pct >= 100) return 'bg-[#10B981] text-white border-[#059669]';
            if (pct >= 50) return 'bg-[#EAB308] text-white border-[#CA8A04]'; 
            return 'bg-[#EF4444] text-white border-[#DC2626]';
        };

        const getSafeNum = (row, keyStr) => {
            let val = row[keyStr] || row[keyStr + " "] || "0";
            return parseFloat(String(val).replace(/,/g, '')) || 0;
        };

        function getDynamicStatus(row, quarter) {
            for (let i = quarter; i >= 1; i--) {
                let s = row["สถานะไตรมาส " + i] || row["สถานะไตรมาส " + i + " "];
                if (s && s.trim() !== "") return s;
            }
            return "⚫ ยังไม่ดำเนินการ";
        }

        const calcSafePct = (actual, plan) => {
            if (plan > 0) return ((actual / plan) * 100).toFixed(2);
            if (actual > 0) return "100.00";
            return "0.00";
        };

        // ฟังก์ชันคำนวณ % ผลงานเทียบแผนสะสม (ตรงกลางโดนัท)
        function getPctVsCurrentPlan(p1, p2, p3, p4, actual, q, isLast) {
            let pCum = 0; let prevCum = 0;
            if (q >= 1) { pCum += p1; prevCum = 0; }
            if (q >= 2) { pCum += p2; prevCum += p1; }
            if (q >= 3) { pCum += p3; prevCum += (p1 + p2); }
            if (q >= 4) { pCum += p4; prevCum += (p1 + p2 + p3); }

            if (pCum === 0) return 0;
            
            if (!isLast && q > 1) {
                return prevCum > 0 ? (actual / prevCum) * 100 : 0;
            } else {
                return pCum > 0 ? (actual / pCum) * 100 : 0;
            }
        }

        // ระบบสมองกลคำนวณสถานะ
        function determineStatus(p1, p2, p3, p4, actual, q, isLast) {
            let pCum = 0; let prevCum = 0;
            if (q >= 1) { pCum += p1; prevCum = 0; }
            if (q >= 2) { pCum += p2; prevCum += p1; }
            if (q >= 3) { pCum += p3; prevCum += (p1 + p2); }
            if (q >= 4) { pCum += p4; prevCum += (p1 + p2 + p3); }

            if (pCum === 0) {
                if (q === 1) return "⚪ มีแผนอยู่ในไตรมาสถัดไป";
                else if (q === 2) return "⚪ มีแผนอยู่ใน Q3/Q4";
                else if (q === 3) return "⚪ มีแผนอยู่ใน Q4";
                else return "⚫ ยังไม่ดำเนินการ";
            }
            if (actual >= pCum) return "🟢 เป็นไปตามแผน";
            
            if (!isLast && q > 1) {
                if (actual >= prevCum) return `🟢 เป็นไปตามแผน`;
                let pct = prevCum > 0 ? (actual / prevCum) * 100 : 0;
                return pct >= 50 ? "🟡 ล่าช้า" : "🔴 เสี่ยง";
            } else {
                let pct = pCum > 0 ? (actual / pCum) * 100 : 0;
                if (actual === 0) return "⚫ ยังไม่ดำเนินการ";
                return pct >= 50 ? "🟡 ล่าช้า" : "🔴 เสี่ยง";
            }
        }

        // ฟังก์ชันวาดเส้น Q บนวงแหวน (องศาอิงตามเป้าหมายทั้งปี)
        function generateDonutMarkers(target, q1, q2, q3) {
            if (target <= 0) return '';
            let html = '';
            const q1Pct = (q1 / target) * 100;
            const q2Pct = ((q1 + q2) / target) * 100;
            const q3Pct = ((q1 + q2 + q3) / target) * 100;

            const makeMarker = (pct, label) => {
                if (pct > 0 && pct < 100) {
                    const degree = pct * 3.6; // แปลง % เป็นองศา
                    return `
                        <div class="absolute top-0 left-0 w-full h-full pointer-events-none" style="transform: rotate(${degree}deg)">
                            <div class="absolute top-[-10px] left-1/2 -translate-x-1/2 w-1 h-7 bg-slate-800 rounded-full shadow-md z-20"></div>
                            <div class="absolute top-[-38px] left-1/2 -translate-x-1/2 z-30" style="transform: rotate(-${degree}deg)">
                                <div class="bg-slate-800 text-white text-xs font-black px-2 py-0.5 rounded shadow-lg border border-slate-600">${label}</div>
                            </div>
                        </div>
                    `;
                }
                return '';
            };

            html += makeMarker(q1Pct, 'Q1');
            html += makeMarker(q2Pct, 'Q2');
            html += makeMarker(q3Pct, 'Q3');
            return html;
        }

        let cachedCSVData = {};
        function fetchCSVData(url) {
            return new Promise((resolve, reject) => {
                Papa.parse(url, {
                    download: true, header: true, skipEmptyLines: true,
                    complete: function(results) { resolve(results.data); },
                    error: function(error) { reject(error); }
                });
            });
        }
        async function fetchCSVWithCache(url) {
            if (cachedCSVData[url]) return cachedCSVData[url]; 
            const data = await fetchCSVData(url);
            cachedCSVData[url] = data;
            return data;
        }

        function toggleDropdown() {
            const menu = document.getElementById('dropdown-menu');
            const icon = document.getElementById('dropdown-icon');
            if (menu.classList.contains('hidden')) {
                menu.classList.remove('hidden');
                setTimeout(() => {
                    menu.classList.remove('opacity-0', 'scale-95');
                    menu.classList.add('opacity-100', 'scale-100');
                    icon.classList.add('rotate-180');
                }, 10);
            } else {
                closeDropdown();
            }
        }

        function closeDropdown() {
            const menu = document.getElementById('dropdown-menu');
            const icon = document.getElementById('dropdown-icon');
            menu.classList.remove('opacity-100', 'scale-100');
            menu.classList.add('opacity-0', 'scale-95');
            icon.classList.remove('rotate-180');
            setTimeout(() => { menu.classList.add('hidden'); }, 200);
        }

            const container = document.getElementById('custom-dropdown-container');
            if (container && !container.contains(event.target)) {
                closeDropdown();
            }
        });

            closeDropdown();
            loadProject(index);
        }

            try {
                const rawIndexData = await fetchCSVWithCache(MASTER_CSV_URL);
                
                MASTER_INDEX = rawIndexData.map(row => ({

                })).filter(row => row.name !== "");

                    } else if (isGroup || (!isGroup && !isSub)) {
                        classes += "bg-slate-50 text-slate-800 font-extrabold border-l-[6px] border-blue-500 hover:bg-slate-100 border-b border-slate-200";
                    } else {
                        classes += "bg-white hover:bg-slate-50 text-slate-600 pl-10 font-medium border-b border-slate-100";
                    }
                    
                    li.className = classes;
                    li.innerHTML = `
                        ${isAll ? '<svg class="w-5 h-5 mr-3 text-amber-300 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z"></path></svg>' : ''}
                        ${(isGroup || (!isGroup && !isSub)) && !isAll ? '<svg class="w-5 h-5 mr-3 text-blue-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>' : ''}
                        ${(!isGroup && isSub) && !isAll ? '<div class="w-5 h-5 mr-3 flex items-center justify-center flex-shrink-0"><div class="w-2.5 h-2.5 rounded-full bg-slate-300 group-hover:bg-blue-400 transition-colors"></div></div>' : ''}
                        <span class="truncate ${isAll ? 'text-lg' : ''}">${displayName}</span>
                    `;

                });

                if(MASTER_INDEX.length > 0) {
                    await loadProject(0);

                    document.getElementById('display-project-name').textContent = "ไม่พบข้อมูลในไฟล์สารบัญ";
                }
            } catch(e) {

            }
        });

        async function loadProject(index) {
            const displayTitle = document.getElementById('display-project-name');
            const dropdownText = document.getElementById('dropdown-text');
            const dropdownBtn = document.getElementById('dropdown-btn');
            
            const selectedItem = MASTER_INDEX[index];
            const viewLevel = selectedItem.url === "AUTO_ALL" ? "ALL" : (selectedItem.url === "AUTO_GROUP" ? "GROUP" : "SINGLE");
            const isActivity = selectedItem.name.trim().startsWith("-");

            document.getElementById('budget-cards-container').classList.add('hidden');
            document.getElementById('kpi-cards-container').classList.add('hidden');
            document.getElementById('pie-charts-container').classList.add('hidden');
            document.getElementById('bar-chart-main-container').classList.add('hidden');
            document.getElementById('table-main-container').classList.add('hidden');
            document.getElementById('issues-main-container').classList.add('hidden');

            const prefix = (selectedItem.seq && String(selectedItem.seq) !== "0") ? `${selectedItem.seq} ` : '';
            const fullDisplayName = `${prefix}${selectedItem.name.replace(/^- /, '')}`;
            
            dropdownText.textContent = fullDisplayName;
            dropdownBtn.title = fullDisplayName; 

            const cleanName = selectedItem.name.replace(/^- /, '');
            
            if (viewLevel === "ALL") {
                displayTitle.textContent = "ภาพรวมกรมส่งเสริมการเกษตร";
            } else {
                displayTitle.textContent = cleanName;
            }

            let itemsToFetch = [];
            if (viewLevel === "ALL") {
                itemsToFetch = MASTER_INDEX.filter(item => item.url.startsWith("http"));
            } else if (viewLevel === "GROUP") {
                itemsToFetch = MASTER_INDEX.filter(item => item.group === selectedItem.group && item.url.startsWith("http") && item.name.trim().startsWith("-"));
            } else {
                if(selectedItem.url.startsWith("http")) itemsToFetch = [selectedItem]; 
            }
            
            try {
                const fetchPromises = itemsToFetch.map(async (item) => {
                    try {
                        const data = await fetchCSVWithCache(item.url);
                        return { item: item, data: data };
                    } catch (e) {
                        return { item: item, data: null };
                    }
                });

                const validFetches = (await Promise.all(fetchPromises)).filter(f => f.data !== null);
                
                if (validFetches.length === 0) {
                    displayTitle.textContent = "ไม่พบข้อมูล กรุณาตรวจสอบลิงก์ CSV";
                    return;
                }

                let flatRows = [];
                validFetches.forEach(f => {
                    const fileItem = f.item;
                    const isSubActivityFile = fileItem.name.trim().startsWith("-");

                    f.data.forEach(row => {
                        let name = row["โครงการ/กิจกรรม"] || "-";
                        const unit = row["หน่วยนับ"] || "ราย";
                        let groupName = "";
                        
                        if (viewLevel === "ALL") {
                            groupName = fileItem.group || "โครงการอื่นๆ";
                        } else if (viewLevel === "GROUP") {
                            groupName = fileItem.name.replace(/^- /, '');
                        } else {
                            groupName = name; 
                        }

                        let isBudget = name.includes("งบประมาณ");
                        if (viewLevel === "ALL" && isSubActivityFile && isBudget) {
                            isBudget = false; 
                        }
                        
                        flatRows.push({
                            originalName: name, 
                            groupName: groupName, 
                            unit: unit,
                            isKPI: name.includes("(KPI)"), 
                            isBudget: isBudget,
                            target: getSafeNum(row, "เป้าหมาย"), actual: getSafeNum(row, "ผลการดำเนินงานสะสม"),
                            planQ1: getSafeNum(row, "แผนไตรมาส 1"), actualQ1: getSafeNum(row, "ผลไตรมาส 1"),
                            planQ2: getSafeNum(row, "แผนไตรมาส 2"), actualQ2: getSafeNum(row, "ผลไตรมาส 2"),
                            planQ3: getSafeNum(row, "แผนไตรมาส 3"), actualQ3: getSafeNum(row, "ผลไตรมาส 3"),
                            planQ4: getSafeNum(row, "แผนไตรมาส 4"), actualQ4: getSafeNum(row, "ผลไตรมาส 4"),
                            issue: row["ปัญหาและอุปสรรค"] || row["ปัญหาและอุปสรรค "] || "",
                            dynamicStat: getDynamicStatus(row, currentQuarter)
                        });
                    });
                });

                let synthesizedRows = [];
                
                if (viewLevel === "SINGLE") {
                    synthesizedRows = flatRows.map(r => ({
                        name: r.originalName, unit: r.unit, isKPI: r.isKPI, isBudget: r.isBudget,
                        target: r.target, actual: r.actual,
                        planQ1: r.planQ1, planQ2: r.planQ2, planQ3: r.planQ3, planQ4: r.planQ4,
                        actualQ1: r.actualQ1, actualQ2: r.actualQ2, actualQ3: r.actualQ3, actualQ4: r.actualQ4,
                        status: r.dynamicStat, issue: r.issue
                    }));
                } else {
                    let kpiAgg = {};
                    let budgetAgg = { target: 0, actual: 0, p1:0, p2:0, p3:0, p4:0, a1:0, a2:0, a3:0, a4:0, unit: "บาท" };
                    let hasBudget = false;
                    
                    flatRows.forEach(r => {
                        if (r.isBudget) {
                            hasBudget = true;
                            budgetAgg.target += r.target; budgetAgg.actual += r.actual;
                            budgetAgg.p1 += r.planQ1; budgetAgg.p2 += r.planQ2; budgetAgg.p3 += r.planQ3; budgetAgg.p4 += r.planQ4;
                            budgetAgg.a1 += r.actualQ1; budgetAgg.a2 += r.actualQ2; budgetAgg.a3 += r.actualQ3; budgetAgg.a4 += r.actualQ4;
                        } else if (r.isKPI) {
                            let key = `${r.groupName}_|_${r.unit}`; 
                            if (!kpiAgg[key]) {
                                kpiAgg[key] = { name: r.groupName, unit: r.unit, target: 0, actual: 0, p1:0, p2:0, p3:0, p4:0, a1:0, a2:0, a3:0, a4:0, issues: [] };
                            }
                            kpiAgg[key].target += r.target; kpiAgg[key].actual += r.actual;
                            kpiAgg[key].p1 += r.planQ1; kpiAgg[key].p2 += r.planQ2; kpiAgg[key].p3 += r.planQ3; kpiAgg[key].p4 += r.planQ4;
                            kpiAgg[key].a1 += r.actualQ1; kpiAgg[key].a2 += r.actualQ2; kpiAgg[key].a3 += r.actualQ3; kpiAgg[key].a4 += r.actualQ4;
                            if (r.issue && r.issue.trim() !== "") kpiAgg[key].issues.push(`- ${r.issue}`);
                        }
                    });
                    
                    Object.values(kpiAgg).forEach(agg => {
                        synthesizedRows.push({
                            name: agg.name, unit: agg.unit, isBudget: false, isKPI: true, isAggregatedKPI: true,
                            target: agg.target, actual: agg.actual,
                            planQ1: agg.p1, planQ2: agg.p2, planQ3: agg.p3, planQ4: agg.p4,
                            actualQ1: agg.a1, actualQ2: agg.a2, actualQ3: agg.a3, actualQ4: agg.a4,

                            issue: viewLevel === "GROUP" ? agg.issues.join("<br>") : ""
                        });
                    });
                    
                    if (hasBudget) {
                        synthesizedRows.push({
                            name: "งบประมาณรวม", unit: "บาท", isKPI: false, isBudget: true,
                            target: budgetAgg.target, actual: budgetAgg.actual,
                            planQ1: budgetAgg.p1, planQ2: budgetAgg.p2, planQ3: budgetAgg.p3, planQ4: budgetAgg.p4,
                            actualQ1: budgetAgg.a1, actualQ2: budgetAgg.a2, actualQ3: budgetAgg.a3, actualQ4: budgetAgg.a4,
                            status: determineStatus(budgetAgg.p1, budgetAgg.p2, budgetAgg.p3, budgetAgg.p4, budgetAgg.actual, currentQuarter, isLastMonthOfQuarter),
                            issue: ""
                        });
                    }
                }
                
                // ถอดซ่อนคอนเทนเนอร์ที่ใช้
                document.getElementById('bar-chart-main-container').classList.remove('hidden');
                document.getElementById('table-main-container').classList.remove('hidden');
                if (viewLevel === 'SINGLE') document.getElementById('issues-main-container').classList.remove('hidden');

                // เริ่มวาด UI รวมฟังก์ชันเดียวให้จบ
                renderDashboardUI(synthesizedRows, viewLevel, isActivity);

            } catch (error) {
                console.error("Critical error in loadProject:", error);
            }
        }

                        `;
                    }

                    const cardBgClass = index % 2 === 0 ? "bg-white shadow-sm border border-slate-200" : "bg-slate-50 shadow-sm border border-slate-200";
                    const labelBgClass = index % 2 === 0 ? "bg-slate-700 text-white shadow-sm" : "bg-slate-500 text-white shadow-sm";

                    barContainer.innerHTML += `
                        <div class="group/bar flex flex-col items-center flex-1 h-full justify-end ${cardBgClass} rounded-2xl mx-2 relative pt-4 pb-2 transition-all duration-300 hover:shadow-md">
                            <div class="flex items-end justify-center h-full w-full relative z-10 px-2">
                                ${barsHtml}
                            </div>
                            <div class="mt-5 mb-2 px-6 py-2.5 ${labelBgClass} rounded-full text-sm sm:text-base font-bold z-20 text-center w-[85%] truncate transition-all duration-300 group-hover/bar:scale-105 border border-transparent">
                                ${q.name}
                            </div>
                        </div>
                    `;
                });

                setTimeout(() => {
                    document.querySelectorAll('#combined-bar-chart-container .bar-chart-col').forEach(bar => { bar.style.height = bar.getAttribute('data-h') + '%'; });
                    document.querySelectorAll('#combined-bar-chart-container .bar-chart-col-text').forEach(text => { text.classList.remove('opacity-0'); });
                }, 50);

                // =====================================
                // 5. วาดตารางสถานะ (ล็อกไว้ 100%)
                // =====================================
                const tbody = document.getElementById('table-body');
                tbody.innerHTML = '';
                tableActivities.forEach((act, index) => {
                    const safeTarget = act.target > 0 ? act.target : 1;
                    const pct = (act.actual / safeTarget) * 100;
                    const q1Pos = Math.min((act.planQ1 / safeTarget) * 100, 100);
                    const q2Pos = Math.min(((act.planQ1 + act.planQ2) / safeTarget) * 100, 100);
                    const q3Pos = Math.min(((act.planQ1 + act.planQ2 + act.planQ3) / safeTarget) * 100, 100);

                    let barColor = "bg-slate-400"; 
                    if (act.status.includes("เป็นไปตามแผน")) barColor = "bg-[#10B981]"; 
                    if (act.status.includes("ล่าช้า")) barColor = "bg-[#EAB308]"; 
                    if (act.status.includes("เสี่ยง")) barColor = "bg-[#EF4444]"; 
                    if (act.status.includes("ยังไม่ดำเนินการ") || act.status.includes("ไม่มี")) barColor = "bg-[#1E293B]"; 
                    if (act.status.includes("มีแผนอยู่ใน")) barColor = "bg-[#94A3B8]";

                    let markersHtml = '';
                    if(q1Pos > 0) markersHtml += `<div class="absolute top-[16px] z-10 flex flex-col items-center -translate-x-1/2" style="left: ${q1Pos}%"><div class="h-3 w-px bg-slate-300"></div></div>`;
                    if(q2Pos > q1Pos) markersHtml += `<div class="absolute top-[16px] z-10 flex flex-col items-center -translate-x-1/2" style="left: ${q2Pos}%"><div class="h-3 w-px bg-slate-300"></div></div>`;
                    if(q3Pos > q2Pos) markersHtml += `<div class="absolute top-[16px] z-10 flex flex-col items-center -translate-x-1/2" style="left: ${q3Pos}%"><div class="h-3 w-px bg-slate-300"></div></div>`;

                    const progressHtml = `
                        <div class="w-full relative mt-6 mb-8 group-hover/row:scale-[1.02] transition-transform duration-300">
                            <div class="absolute -top-6 -translate-x-1/2 z-20 bar-chart-col-text flex flex-col items-center" style="left: 0%" data-left="${Math.min(pct, 100)}">
                                <div class="bg-slate-700 text-white px-1.5 py-0.5 rounded text-[11px] font-bold whitespace-nowrap shadow-sm">${pct.toFixed(2)}%</div>
                                <div class="w-0.5 h-1.5 bg-slate-700"></div>
                            </div>
                            <div class="h-4 bg-slate-100 rounded-full relative overflow-hidden border border-slate-200 shadow-inner">
                                <div class="h-full ${barColor} progress-bar-fill rounded-full" style="width: 0%" data-w="${Math.min(pct, 100)}"></div>
                            </div>
                            ${markersHtml}
                        </div>
                    `;

                    const isRowKPI = act.name.includes("(KPI)") || act.isAggregatedKPI;
                    let displayName = act.name;
                    let namePrefix = '';

                    if (isRowKPI && viewLevel === 'SINGLE') {
                        if (act.name.includes("(KPI)")) {
                            displayName = act.name.replace("(KPI)", '');
                            namePrefix = '<span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-black bg-[#3B82F6] text-white mr-3 shadow-md transform -skew-x-6 tracking-widest">(KPI)</span>';
                        }
                    } else {
                        displayName = act.name.replace("(KPI)", ''); 
                    }

                    let rowBgClass = '';
                    if (isRowKPI && viewLevel === 'SINGLE') {
                        rowBgClass = 'bg-[#EFF6FF] hover:bg-[#DBEAFE] border-l-[5px] border-l-[#3B82F6] relative z-10 shadow-sm';
                    } else {
                        rowBgClass = (index % 2 === 0) ? 'bg-white hover:bg-slate-50' : 'bg-slate-50 hover:bg-slate-100';
                    }
                    
                    const nameStyle = (isRowKPI && viewLevel === 'SINGLE') ? "text-[#1E3A8A] font-extrabold text-[15px]" : "text-slate-800 font-medium";

                    tbody.innerHTML += `
                        <tr class="group/row border-b border-slate-200 ${rowBgClass} transition-colors duration-300">
                            <td class="px-6 py-5 align-middle"><div class="leading-relaxed ${nameStyle} group-hover/row:translate-x-1 transition-transform duration-300 flex items-center break-words">${namePrefix}${displayName}</div></td>
                            <td class="px-4 py-5 align-middle text-center text-slate-500 font-bold break-words">${act.unit}</td>
                            <td class="px-4 py-5 align-middle text-center font-bold text-slate-700 break-words">${formatAutoDecimal(act.target)}</td>
                            <td class="px-4 py-5 align-middle text-center font-extrabold text-[#2563EB] break-words">${formatAutoDecimal(act.actual)}</td>
                            <td class="px-6 py-5 align-middle">${progressHtml}</td>
                            <td class="px-6 py-5 align-middle text-center">
                                <span class="inline-flex items-center px-4 py-2 rounded-full text-[13px] font-bold whitespace-nowrap shadow-sm break-words ${getStatusStyles(act.status)}">${act.status}</span>
                            </td>
                        </tr>
                    `;
                });

                setTimeout(() => {
                    document.querySelectorAll('#table-body .progress-bar-fill').forEach(bar => { bar.style.width = bar.getAttribute('data-w') + '%'; });
                    document.querySelectorAll('#table-body .bar-chart-col-text').forEach(textEl => { textEl.style.left = textEl.getAttribute('data-left') + '%'; });
                }, 100);

                if (viewLevel === 'SINGLE') {
                    let issuesHtml = '';
                    const isAnyRisk = Object.values(kpiByUnit).some(u => {
                        let st = determineStatus(u.planQ1, u.planQ2, u.planQ3, u.planQ4, u.actual, currentQuarter, isLastMonthOfQuarter);
                        return st.includes("ล่าช้า") || st.includes("เสี่ยง") || st.includes("ยังไม่ดำเนินการ");
                    });

                    if (isAnyRisk) {
                        issuesHtml += `
                            <div class="bg-red-50 border-l-4 border-red-500 p-5 rounded-r-xl shadow-md mb-6 transform transition-transform hover:-translate-y-1 anim-danger">
                                <h4 class="font-bold text-red-800 mb-2 flex items-center break-words">แจ้งเตือนสถานะภาพรวม</h4>
                                <p class="text-sm text-red-700 leading-relaxed font-medium break-words">ผลการดำเนินงานสะสมยังต่ำกว่าแผนงานสะสม ณ ไตรมาสปัจจุบัน ขอให้เร่งรัดการดำเนินงานและติดตามอย่างใกล้ชิด</p>
                            </div>
                        `;
                    }

                    const problematicActivities = displayActivities.filter(a => 
                        (a.status && (a.status.includes("ล่าช้า") || a.status.includes("เสี่ยง") || a.status.includes("ยังไม่ดำเนินการ"))) || 
                        (a.issue && a.issue.trim() !== "")
                    );
                    
                    if (problematicActivities.length > 0) {
                        issuesHtml += `<h4 class="font-bold text-[#7F1D1D] mb-4 text-base relative z-10 px-1 break-words">รายการที่มีความล่าช้า/ปัญหา</h4><div class="grid grid-cols-1 md:grid-cols-2 gap-4 relative z-10">`;
                        problematicActivities.forEach(act => {
                            const issueText = (act.issue && act.issue.trim() !== "") ? act.issue : "อยู่ระหว่างตรวจสอบและรวบรวมสาเหตุการดำเนินงานจาก สำนัก/กอง ที่รับผิดชอบโครงการ";
                            
                            let statusColor = "text-slate-600 bg-slate-50 border-slate-200";
                            if (act.status.includes("เสี่ยง")) statusColor = "text-[#991B1B] bg-[#FEE2E2] border-[#F87171] anim-danger";
                            else if (act.status.includes("ล่าช้า")) statusColor = "text-[#854D0E] bg-[#FEF08A] border-[#FACC15] anim-warning";
                            else if (act.status.includes("ยังไม่ดำเนินการ") || act.status.includes("ไม่มี")) statusColor = "text-white bg-[#1E293B] border-[#0F172A] shadow-md anim-critical";
                            
                            let displayName = act.name;
                            if (act.isKPI && viewLevel === 'SINGLE') {
                                if (act.name.includes("(KPI)")) {
                                    displayName = act.name.replace("(KPI)", '<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold bg-[#3B82F6] text-white mr-2 border border-[#2563EB] shadow-sm break-words">(KPI)</span>');
                                }
                            }

                            issuesHtml += `
                                <div class="border border-[#FECACA] rounded-2xl p-5 bg-white shadow-sm flex flex-col transform transition-all duration-300 hover:-translate-y-1 hover:shadow-md">
                                    <div class="mb-3"><span class="inline-flex items-center px-3 py-1.5 rounded-full text-xs font-bold border shadow-sm break-words ${statusColor}">${act.status}</span></div>
                                    <h5 class="text-sm font-bold text-[#7F1D1D] mb-3 leading-relaxed break-words">${displayName}</h5>
                                    <div class="bg-[#FEF2F2] p-4 rounded-xl border border-[#FECACA] flex-grow">
                                        <p class="text-sm text-[#991B1B] leading-relaxed font-medium break-words"><span class="font-semibold text-[#7F1D1D] opacity-80 break-words">สาเหตุ/อุปสรรค:</span> <br> ${issueText}</p>
                                    </div>
                                </div>
                            `;
                        });
                        issuesHtml += `</div>`;
                    } else {
                        issuesHtml = `<div class="bg-white p-6 rounded-2xl border border-white text-center text-slate-500 font-medium shadow-sm relative z-10 break-words">ไม่พบปัญหาหรือความเสี่ยงในการดำเนินงาน ณ ปัจจุบัน</div>`;
                    }
                    document.getElementById('issues-container').innerHTML = issuesHtml;
                }

            } catch (error) {
                console.error("Critical error in renderDashboard UI:", error);
            }
        }
    </script>
</body>
</html>
