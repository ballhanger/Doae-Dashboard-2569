</head>
<body class="p-4 sm:p-6 lg:p-8 text-slate-800">

                <svg class="w-6 h-6 mr-3 text-rose-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>

    <script>
        const MASTER_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRzugFLo6mVzCbdo35AtXw_M7MDRuVbxGPk9oU_Q8n1C0jB1SAMkRtRinn7gUEUS-d_FrcQzbkEKWvx/pub?gid=0&single=true&output=csv";
        let MASTER_INDEX = [];

        const today = new Date();
        const currentMonth = today.getMonth() + 1;
        let currentQuarter = 1;
        let isLastMonthOfQuarter = false;

        if (currentMonth >= 10 && currentMonth <= 12) { 
            currentQuarter = 1; isLastMonthOfQuarter = (currentMonth === 12); 
        } else if (currentMonth >= 1 && currentMonth <= 3) { 
            currentQuarter = 2; isLastMonthOfQuarter = (currentMonth === 3); 
        } else if (currentMonth >= 4 && currentMonth <= 6) { 
            currentQuarter = 3; isLastMonthOfQuarter = (currentMonth === 6); 
        } else if (currentMonth >= 7 && currentMonth <= 9) { 
            currentQuarter = 4; isLastMonthOfQuarter = (currentMonth === 9); 
        }

        const kpiColorThemes = [
            { planBg: 'bg-emerald-200', planBorder: 'border-emerald-400', planText: 'text-emerald-800', actBg: 'bg-emerald-500', actBorder: 'border-emerald-600', actText: 'text-emerald-950', legendPlanBg: 'bg-emerald-300', legendActBg: 'bg-emerald-500' },
            { planBg: 'bg-blue-200', planBorder: 'border-blue-400', planText: 'text-blue-800', actBg: 'bg-blue-500', actBorder: 'border-blue-600', actText: 'text-blue-950', legendPlanBg: 'bg-blue-300', legendActBg: 'bg-blue-500' },
            { planBg: 'bg-purple-200', planBorder: 'border-purple-400', planText: 'text-purple-800', actBg: 'bg-purple-500', actBorder: 'border-purple-600', actText: 'text-purple-950', legendPlanBg: 'bg-purple-300', legendActBg: 'bg-purple-500' },
            { planBg: 'bg-pink-200', planBorder: 'border-pink-400', planText: 'text-pink-800', actBg: 'bg-pink-500', actBorder: 'border-pink-600', actText: 'text-pink-950', legendPlanBg: 'bg-pink-300', legendActBg: 'bg-pink-500' },
            { planBg: 'bg-cyan-200', planBorder: 'border-cyan-400', planText: 'text-cyan-800', actBg: 'bg-cyan-500', actBorder: 'border-cyan-600', actText: 'text-cyan-950', legendPlanBg: 'bg-cyan-300', legendActBg: 'bg-cyan-500' },
            { planBg: 'bg-rose-200', planBorder: 'border-rose-400', planText: 'text-rose-800', actBg: 'bg-rose-500', actBorder: 'border-rose-600', actText: 'text-rose-950', legendPlanBg: 'bg-rose-300', legendActBg: 'bg-rose-500' },
            { planBg: 'bg-teal-200', planBorder: 'border-teal-400', planText: 'text-teal-800', actBg: 'bg-teal-500', actBorder: 'border-teal-600', actText: 'text-teal-950', legendPlanBg: 'bg-teal-300', legendActBg: 'bg-teal-500' },
            { planBg: 'bg-violet-200', planBorder: 'border-violet-400', planText: 'text-violet-800', actBg: 'bg-violet-500', actBorder: 'border-violet-600', actText: 'text-violet-950', legendPlanBg: 'bg-violet-300', legendActBg: 'bg-violet-500' },
            { planBg: 'bg-fuchsia-200', planBorder: 'border-fuchsia-400', planText: 'text-fuchsia-800', actBg: 'bg-fuchsia-500', actBorder: 'border-fuchsia-600', actText: 'text-fuchsia-950', legendPlanBg: 'bg-fuchsia-300', legendActBg: 'bg-fuchsia-500' },
            { planBg: 'bg-sky-200', planBorder: 'border-sky-400', planText: 'text-sky-800', actBg: 'bg-sky-500', actBorder: 'border-sky-600', actText: 'text-sky-950', legendPlanBg: 'bg-sky-300', legendActBg: 'bg-sky-500' }
        ];

        const formatMoney = (num) => new Intl.NumberFormat('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num);
        const formatAutoDecimal = (num) => {
            if (num % 1 !== 0) return new Intl.NumberFormat('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num);
            return new Intl.NumberFormat('th-TH').format(num); 
        };

        const getStatusStyles = (status) => {
            if (!status) return "bg-slate-100 text-slate-600 border-slate-300";
            if (status.includes("เป็นไปตามแผน")) return "bg-green-100 text-green-800 border-green-400 shadow-sm";
            if (status.includes("ล่าช้า")) return "bg-yellow-100 text-yellow-800 border-yellow-400 shadow-sm status-highlight";
            if (status.includes("เสี่ยง")) return "bg-red-100 text-red-800 border-red-300 shadow-sm";
            if (status.includes("ยังไม่ดำเนินการ") || status.includes("ไม่มี")) return "bg-red-600 text-white border-red-800 shadow-md animate-pulse ring-2 ring-red-300 font-bold";
            return "bg-slate-100 text-slate-600 border-slate-300";
        };

        const getBadgeColor = (actual, plan) => {
            if (plan === 0 && actual === 0) return 'bg-slate-500 text-white border-slate-600'; 
            const pct = plan > 0 ? (actual / plan) * 100 : (actual > 0 ? 100 : 0);
            if (pct >= 100) return 'bg-green-600 text-white border-green-700';
            if (pct >= 50) return 'bg-yellow-500 text-white border-yellow-600'; 
            return 'bg-red-500 text-white border-red-600';
        };

        const getSafeNum = (row, keyStr) => {
            let val = row[keyStr] || row[keyStr + " "] || "0";
            return parseFloat(String(val).replace(/,/g, '')) || 0;
        };

        function getDynamicStatus(row, quarter) {
            for (let i = quarter; i >= 1; i--) {
                let s = row["สถานะไตรมาส " + i] || row["สถานะไตรมาส " + i + " "];
                if (s && s.trim() !== "") return s;
            }
            return "❌ ยังไม่ดำเนินการ";
        }

        const calcSafePct = (actual, plan) => {
            if (plan > 0) return ((actual / plan) * 100).toFixed(2);
            if (actual > 0) return "100.00";
            return "0.00";
        };

        function determineStatus(p1, p2, p3, p4, actual, q, isLast) {
            let pCum = 0; let prevCum = 0;
            if (q >= 1) { pCum += p1; prevCum = 0; }
            if (q >= 2) { pCum += p2; prevCum += p1; }
            if (q >= 3) { pCum += p3; prevCum += (p1 + p2); }
            if (q >= 4) { pCum += p4; prevCum += (p1 + p2 + p3); }

            if (pCum === 0) {
                if (q === 1) return "⚪ มีแผนอยู่ในไตรมาสถัดไป";
                else if (q === 2) return "⚪ มีแผนอยู่ใน Q3/Q4";
                else if (q === 3) return "⚪ มีแผนอยู่ใน Q4";
                else return "❌ ยังไม่ดำเนินการ";
            }
            if (actual >= pCum) return "🟢 เป็นไปตามแผน";
            
            if (!isLast && q > 1) {
                if (actual >= prevCum) return `🟢 เป็นไปตามแผน`;
                let pct = prevCum > 0 ? (actual / prevCum) * 100 : 0;
                return pct >= 50 ? "🟡 ล่าช้า" : "🔴 เสี่ยง";
            } else {
                let pct = pCum > 0 ? (actual / pCum) * 100 : 0;
                return pct >= 50 ? "🟡 ล่าช้า" : "🔴 เสี่ยง";
            }
        }

        let cachedCSVData = {};
        function fetchCSVData(url) {
            return new Promise((resolve, reject) => {
                Papa.parse(url, {
                    download: true, header: true, skipEmptyLines: true,
                    complete: function(results) { resolve(results.data); },
                    error: function(error) { reject(error); }
                });
            });
        }
        async function fetchCSVWithCache(url) {
            if (cachedCSVData[url]) return cachedCSVData[url]; 
            const data = await fetchCSVData(url);
            cachedCSVData[url] = data;
            return data;
        }

        // =====================================
        // ระบบ Custom Dropdown Menu
        // =====================================
        function toggleDropdown() {
            const menu = document.getElementById('dropdown-menu');
            const icon = document.getElementById('dropdown-icon');
            if (menu.classList.contains('hidden')) {
                menu.classList.remove('hidden');
                setTimeout(() => {
                    menu.classList.remove('opacity-0', 'scale-95');
                    menu.classList.add('opacity-100', 'scale-100');
                    icon.classList.add('rotate-180');
                }, 10);
            } else {
                closeDropdown();
            }
        }

        function closeDropdown() {
            const menu = document.getElementById('dropdown-menu');
            const icon = document.getElementById('dropdown-icon');
            menu.classList.remove('opacity-100', 'scale-100');
            menu.classList.add('opacity-0', 'scale-95');
            icon.classList.remove('rotate-180');
            setTimeout(() => { menu.classList.add('hidden'); }, 200);
        }

        document.addEventListener('click', (event) => {
            const container = document.getElementById('custom-dropdown-container');
            if (container && !container.contains(event.target)) {
                closeDropdown();
            }
        });

        function selectProject(index) {
            closeDropdown();
            loadProject(index);
        }

        // =====================================
        // Initialize
        // =====================================
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const rawIndexData = await fetchCSVWithCache(MASTER_CSV_URL);
                
                MASTER_INDEX = rawIndexData.map(row => ({
                    seq: row["ลำดับ"] || "",
                    name: row["ชื่อโครงการ/กิจกรรม"] || "",
                    url: row["ลิงก์ CSV"] ? row["ลิงก์ CSV"].trim() : "",
                    group: row["โครงการหลัก"] || ""
                })).filter(row => row.name !== ""); 

                const list = document.getElementById('dropdown-list');
                list.innerHTML = '';
                
                MASTER_INDEX.forEach((item, index) => {
                    const li = document.createElement('li');
                    const isAll = item.url === "AUTO_ALL";
                    const isGroup = item.url === "AUTO_GROUP";
                    const isSub = item.name.trim().startsWith("-"); 
                    const prefix = (item.seq && String(item.seq) !== "0") ? `${item.seq} ` : '';
                    const displayName = `${prefix}${item.name.replace(/^- /, '')}`;

                    li.title = displayName; // Tooltip ชื่อเต็ม

                    let classes = "px-5 py-3.5 cursor-pointer transition-colors flex items-center ";
                    if (isAll) {
                        classes += "bg-gradient-to-r from-indigo-800 to-indigo-600 text-white font-extrabold sticky top-0 z-20 hover:from-indigo-900 hover:to-indigo-700 shadow-md border-b-4 border-indigo-900";
                    } else if (isGroup || (!isGroup && !isSub)) {
                        classes += "bg-slate-100 text-indigo-950 font-extrabold border-l-[6px] border-indigo-500 hover:bg-slate-200 border-b border-slate-200 shadow-inner";
                    } else {
                        classes += "bg-white hover:bg-indigo-50 text-slate-700 pl-10 font-medium border-b border-slate-100";
                    }
                    
                    li.className = classes;
                    // ล็อกไอคอน w-5 h-5 เท่ากันหมด
                    li.innerHTML = `
                        ${isAll ? '<svg class="w-5 h-5 mr-3 text-amber-400 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z"></path></svg>' : ''}
                        ${(isGroup || (!isGroup && !isSub)) && !isAll ? '<svg class="w-5 h-5 mr-3 text-indigo-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>' : ''}
                        ${(!isGroup && isSub) && !isAll ? '<div class="w-5 h-5 mr-3 flex items-center justify-center flex-shrink-0"><div class="w-2.5 h-2.5 rounded-full bg-slate-300 group-hover:bg-indigo-400 transition-colors"></div></div>' : ''}
                        <span class="truncate ${isAll ? 'text-lg' : ''}">${displayName}</span>
                    `;
                    li.onclick = () => selectProject(index);
                    list.appendChild(li);
                });

                if(MASTER_INDEX.length > 0) {
                    await loadProject(0);
                } else {
                    document.getElementById('display-project-name').textContent = "ไม่พบข้อมูลในไฟล์สารบัญ";
                }
            } catch(e) {
                console.error("Error loading master index:", e);
                document.getElementById('display-project-name').textContent = "เกิดข้อผิดพลาดในการเชื่อมต่อไฟล์สารบัญ";
            }
        });

        // =====================================
        // การดึงข้อมูลและประมวลผลเป็น Flat Data
        // =====================================
        async function loadProject(index) {
            const displayTitle = document.getElementById('display-project-name');
            const dropdownText = document.getElementById('dropdown-text');
            const selectedItem = MASTER_INDEX[index];
            const viewLevel = selectedItem.url === "AUTO_ALL" ? "ALL" : (selectedItem.url === "AUTO_GROUP" ? "GROUP" : "SINGLE");

            // ซ่อนหน้าเว็บระหว่างโหลด
            document.getElementById('bar-chart-main-container').classList.add('hidden');
            document.getElementById('summary-main-container').classList.add('hidden');
            document.getElementById('table-main-container').classList.add('hidden');
            document.getElementById('issues-main-container').classList.add('hidden');

            const prefix = (selectedItem.seq && String(selectedItem.seq) !== "0") ? `${selectedItem.seq} ` : '';
            dropdownText.textContent = `${prefix}${selectedItem.name.replace(/^- /, '')}`;

            const cleanName = selectedItem.name.replace(/^- /, '');
            if (viewLevel === "ALL") {
                displayTitle.textContent = `${cleanName} ปีงบประมาณ 2569`;
            } else {
                displayTitle.textContent = cleanName;
            }
            displayTitle.classList.remove("text-red-600");

            if (viewLevel === "ALL") {
                document.getElementById('dynamic-summary-title').innerHTML = `<svg class="w-7 h-7 mr-3 text-indigo-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg> ภาพรวมสถานะทุกโครงการ`;
                document.getElementById('dynamic-table-title').innerHTML = `<svg class="w-6 h-6 mr-3 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg> ติดตามสถานะรายโครงการ`;
            } else if (viewLevel === "GROUP") {
                document.getElementById('dynamic-summary-title').innerHTML = `<svg class="w-7 h-7 mr-3 text-indigo-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg> ภาพรวมสถานะกิจกรรมหลัก`;
                document.getElementById('dynamic-table-title').innerHTML = `<svg class="w-6 h-6 mr-3 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg> ติดตามสถานะรายกิจกรรมหลัก`;
            } else {
                document.getElementById('dynamic-summary-title').innerHTML = `<svg class="w-7 h-7 mr-3 text-indigo-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg> ภาพรวมสถานะกิจกรรม`;
                document.getElementById('dynamic-table-title').innerHTML = `<svg class="w-6 h-6 mr-3 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg> ติดตามสถานะรายละเอียดกิจกรรม`;
            }

            let itemsToFetch = [];
            if (viewLevel === "ALL") {
                itemsToFetch = MASTER_INDEX.filter(item => item.url.startsWith("http"));
            } else if (viewLevel === "GROUP") {
                itemsToFetch = MASTER_INDEX.filter(item => item.group === selectedItem.group && item.url.startsWith("http") && item.name.trim().startsWith("-"));
            } else {
                if(selectedItem.url.startsWith("http")) itemsToFetch = [selectedItem]; 
            }
            
            try {
                const fetchPromises = itemsToFetch.map(async (item) => {
                    try {
                        const data = await fetchCSVWithCache(item.url);
                        return { item: item, data: data };
                    } catch (e) {
                        return { item: item, data: null };
                    }
                });

                const validFetches = (await Promise.all(fetchPromises)).filter(f => f.data !== null);
                
                if (validFetches.length === 0) {
                    displayTitle.textContent = "ไม่พบข้อมูล กรุณาตรวจสอบลิงก์ CSV";
                    displayTitle.classList.add("text-red-600");
                    return;
                }

                let flatRows = [];
                validFetches.forEach(f => {
                    const fileItem = f.item;
                    f.data.forEach(row => {
                        let name = row["โครงการ/กิจกรรม"] || "-";
                        const unit = row["หน่วยนับ"] || "ราย";
                        let groupName = "";
                        
                        if (viewLevel === "ALL") {
                            groupName = fileItem.group || "โครงการอื่นๆ";
                        } else if (viewLevel === "GROUP") {
                            groupName = fileItem.name.replace(/^- /, '');
                        } else {
                            groupName = name; 
                        }
                        
                        flatRows.push({
                            originalName: name, 
                            groupName: groupName, 
                            unit: unit,
                            isKPI: name.includes("(KPI)"), 
                            isBudget: name.includes("งบประมาณ"),
                            target: getSafeNum(row, "เป้าหมาย"), actual: getSafeNum(row, "ผลการดำเนินงานสะสม"),
                            planQ1: getSafeNum(row, "แผนไตรมาส 1"), actualQ1: getSafeNum(row, "ผลไตรมาส 1"),
                            planQ2: getSafeNum(row, "แผนไตรมาส 2"), actualQ2: getSafeNum(row, "ผลไตรมาส 2"),
                            planQ3: getSafeNum(row, "แผนไตรมาส 3"), actualQ3: getSafeNum(row, "ผลไตรมาส 3"),
                            planQ4: getSafeNum(row, "แผนไตรมาส 4"), actualQ4: getSafeNum(row, "ผลไตรมาส 4"),
                            issue: row["ปัญหาและอุปสรรค"] || row["ปัญหาและอุปสรรค "] || "",
                            dynamicStat: getDynamicStatus(row, currentQuarter)
                        });
                    });
                });

                let synthesizedRows = [];
                
                if (viewLevel === "SINGLE") {
                    synthesizedRows = flatRows.map(r => ({
                        name: r.originalName, unit: r.unit, isKPI: r.isKPI, isBudget: r.isBudget,
                        target: r.target, actual: r.actual,
                        planQ1: r.planQ1, planQ2: r.planQ2, planQ3: r.planQ3, planQ4: r.planQ4,
                        actualQ1: r.actualQ1, actualQ2: r.actualQ2, actualQ3: r.actualQ3, actualQ4: r.actualQ4,
                        status: r.dynamicStat, issue: r.issue
                    }));
                } else {
                    let kpiAgg = {};
                    let budgetAgg = { target: 0, actual: 0, p1:0, p2:0, p3:0, p4:0, a1:0, a2:0, a3:0, a4:0, unit: "บาท" };
                    let hasBudget = false;
                    
                    flatRows.forEach(r => {
                        if (r.isBudget) {
                            hasBudget = true;
                            budgetAgg.target += r.target; budgetAgg.actual += r.actual;
                            budgetAgg.p1 += r.planQ1; budgetAgg.p2 += r.planQ2; budgetAgg.p3 += r.planQ3; budgetAgg.p4 += r.planQ4;
                            budgetAgg.a1 += r.actualQ1; budgetAgg.a2 += r.actualQ2; budgetAgg.a3 += r.actualQ3; budgetAgg.a4 += r.actualQ4;
                        } else if (r.isKPI) {
                            let key = `${r.groupName}_|_${r.unit}`; 
                            if (!kpiAgg[key]) {
                                kpiAgg[key] = { name: r.groupName, unit: r.unit, target: 0, actual: 0, p1:0, p2:0, p3:0, p4:0, a1:0, a2:0, a3:0, a4:0, issues: [] };
                            }
                            kpiAgg[key].target += r.target; kpiAgg[key].actual += r.actual;
                            kpiAgg[key].p1 += r.planQ1; kpiAgg[key].p2 += r.planQ2; kpiAgg[key].p3 += r.planQ3; kpiAgg[key].p4 += r.planQ4;
                            kpiAgg[key].a1 += r.actualQ1; kpiAgg[key].a2 += r.actualQ2; kpiAgg[key].a3 += r.actualQ3; kpiAgg[key].a4 += r.actualQ4;
                            if (r.issue && r.issue.trim() !== "") kpiAgg[key].issues.push(`- ${r.issue}`);
                        }
                    });
                    
                    Object.values(kpiAgg).forEach(agg => {
                        synthesizedRows.push({
                            name: agg.name, unit: agg.unit, isBudget: false, isKPI: true, isAggregatedKPI: true,
                            target: agg.target, actual: agg.actual,
                            planQ1: agg.p1, planQ2: agg.p2, planQ3: agg.p3, planQ4: agg.p4,
                            actualQ1: agg.a1, actualQ2: agg.a2, actualQ3: agg.a3, actualQ4: agg.a4,
                            status: determineStatus(agg.p1, agg.p2, agg.p3, agg.p4, agg.actual, currentQuarter, isLastMonthOfQuarter),
                            issue: viewLevel === "GROUP" ? agg.issues.join("<br>") : ""
                        });
                    });
                    
                    if (hasBudget) {
                        synthesizedRows.push({
                            name: "งบประมาณรวม", unit: "บาท", isKPI: false, isBudget: true,
                            target: budgetAgg.target, actual: budgetAgg.actual,
                            planQ1: budgetAgg.p1, planQ2: budgetAgg.p2, planQ3: budgetAgg.p3, planQ4: budgetAgg.p4,
                            actualQ1: budgetAgg.a1, actualQ2: budgetAgg.a2, actualQ3: budgetAgg.a3, actualQ4: budgetAgg.a4,
                            status: determineStatus(budgetAgg.p1, budgetAgg.p2, budgetAgg.p3, budgetAgg.p4, budgetAgg.actual, currentQuarter, isLastMonthOfQuarter),
                            issue: ""
                        });
                    }
                }
                
                // Show Main Containers Before Rendering Inner Components
                document.getElementById('bar-chart-main-container').classList.remove('hidden');
                document.getElementById('summary-main-container').classList.remove('hidden');
                document.getElementById('table-main-container').classList.remove('hidden');
                if (viewLevel === 'SINGLE') {
                    document.getElementById('issues-main-container').classList.remove('hidden');
                }

                renderDashboardUI(synthesizedRows, viewLevel);

            } catch (error) {
                console.error("Critical error in loadProject:", error);
            }
        }

        // =====================================
        // ฟังก์ชันวาดกราฟและตาราง (UI)
        // =====================================
        function renderDashboardUI(allRows, viewLevel) {
            try {
                const kpiActivities = allRows.filter(act => act.isKPI);
                const budgetRows = allRows.filter(act => act.isBudget);
                const tableActivities = allRows.filter(act => !act.isBudget); 
                
                const kpiByUnit = {};
                kpiActivities.forEach(act => {
                    const u = act.unit || "ราย";
                    if (!kpiByUnit[u]) kpiByUnit[u] = { target: 0, actual: 0, p1: 0, p2: 0, p3: 0, p4: 0, a1: 0, a2: 0, a3: 0, a4: 0 };
                    kpiByUnit[u].target += act.target; kpiByUnit[u].actual += act.actual;
                    kpiByUnit[u].p1 += act.planQ1; kpiByUnit[u].p2 += act.planQ2; kpiByUnit[u].p3 += act.planQ3; kpiByUnit[u].p4 += act.planQ4;
                    kpiByUnit[u].a1 += act.actualQ1; kpiByUnit[u].a2 += act.actualQ2; kpiByUnit[u].a3 += act.actualQ3; kpiByUnit[u].a4 += act.actualQ4;
                });

                if (Object.keys(kpiByUnit).length === 0) {
                    kpiByUnit["ราย"] = { target: 0, actual: 0, p1: 0, p2: 0, p3: 0, p4: 0, a1: 0, a2: 0, a3: 0, a4: 0 };
                }

                // -- 2. วาด Top KPI Cards --
                const kpiCardsContainer = document.getElementById('kpi-cards-container');
                kpiCardsContainer.innerHTML = '';
                
                Object.keys(kpiByUnit).forEach((unit, idx) => {
                    const d = kpiByUnit[unit];
                    kpiCardsContainer.innerHTML += `
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full fade-in-up" style="animation-delay: ${idx * 100}ms">
                            <div class="group bg-gradient-to-br from-indigo-100 to-indigo-50 rounded-[1.5rem] shadow-md border border-indigo-200 p-6 sm:p-8 flex flex-col relative border-l-[6px] border-l-indigo-600 min-h-[160px] transform transition-all duration-500 hover:-translate-y-2 hover-glow overflow-hidden cursor-default">
                                <div class="w-full text-left z-10 mb-2">
                                    <p class="text-base sm:text-lg font-bold text-indigo-900">เป้าหมายรวม <span class="text-sm font-medium text-indigo-700/80 block sm:inline mt-1 sm:mt-0">(เฉพาะ KPI หน่วย: ${unit})</span></p>
                                </div>
                                <div class="w-full flex-grow flex items-center justify-center z-10 pb-2">
                                    <h2 class="text-5xl sm:text-6xl font-black text-indigo-950 tracking-tight transition-all">${formatAutoDecimal(d.target)} <span class="text-xl sm:text-3xl font-bold text-indigo-700/50 ml-1">${unit}</span></h2>
                                </div>
                            </div>
                            <div class="group bg-gradient-to-br from-emerald-100 to-emerald-50 rounded-[1.5rem] shadow-md border border-emerald-200 p-6 sm:p-8 flex flex-col relative border-l-[6px] border-l-emerald-600 min-h-[160px] transform transition-all duration-500 hover:-translate-y-2 hover-glow overflow-hidden cursor-default">
                                <div class="w-full text-left z-10 mb-2">
                                    <p class="text-base sm:text-lg font-bold text-emerald-900">ผลการดำเนินงานสะสม <span class="text-sm font-medium text-emerald-700/80 block sm:inline mt-1 sm:mt-0">(เฉพาะ KPI หน่วย: ${unit})</span></p>
                                </div>
                                <div class="w-full flex-grow flex items-center justify-center z-10 pb-2">
                                    <h2 class="text-5xl sm:text-6xl font-black text-emerald-950 tracking-tight transition-all">${formatAutoDecimal(d.actual)} <span class="text-xl sm:text-3xl font-bold text-emerald-700/50 ml-1">${unit}</span></h2>
                                </div>
                            </div>
                        </div>
                    `;
                });

                // -- 3. งบประมาณ --
                if (budgetRows.length > 0) {
                    const bObj = budgetRows[0];
                    document.getElementById('budget-section').classList.remove('hidden');
                    document.getElementById('budget-target').innerHTML = `${formatMoney(bObj.target)} <span class="text-xl font-bold text-amber-700/60 ml-1">${bObj.unit}</span>`;
                    document.getElementById('budget-actual').innerHTML = `${formatMoney(bObj.actual)} <span class="text-xl font-bold text-emerald-600/60 ml-1">${bObj.unit}</span>`;
                } else {
                    document.getElementById('budget-section').classList.add('hidden');
                }

                // -- 4. วาดกราฟวงกลมเปรียบเทียบ (Dynamic Grid) --
                const numPieCharts = Object.keys(kpiByUnit).length + (budgetRows.length > 0 ? 1 : 0);
                const pieChartsContainer = document.getElementById('pie-charts-container');
                pieChartsContainer.className = 'grid gap-6 mb-8 fade-in-up delay-300';
                
                if (numPieCharts === 1) {
                    pieChartsContainer.classList.add('grid-cols-1', 'max-w-md', 'mx-auto');
                } else if (numPieCharts === 2) {
                    pieChartsContainer.classList.add('grid-cols-1', 'md:grid-cols-2', 'max-w-4xl', 'mx-auto');
                } else if (numPieCharts === 3) {
                    pieChartsContainer.classList.add('grid-cols-1', 'md:grid-cols-3');
                } else if (numPieCharts === 4) {
                    pieChartsContainer.classList.add('grid-cols-1', 'md:grid-cols-2', 'xl:grid-cols-4');
                } else {
                    pieChartsContainer.classList.add('grid-cols-1', 'md:grid-cols-2', 'lg:grid-cols-3', 'xl:grid-cols-4');
                }
                
                pieChartsContainer.innerHTML = '';
                const pieAnimations = [];

                Object.keys(kpiByUnit).forEach((unit, idx) => {
                    const d = kpiByUnit[unit];
                    const percentCum = d.target > 0 ? ((d.actual / d.target) * 100).toFixed(2) : "0.00";
                    
                    let pCum = 0, prevCum = 0;
                    if (currentQuarter >= 1) { pCum += d.p1; prevCum = 0; }
                    if (currentQuarter >= 2) { pCum += d.p2; prevCum += d.p1; }
                    if (currentQuarter >= 3) { pCum += d.p3; prevCum += (d.p1 + d.p2); }
                    if (currentQuarter >= 4) { pCum += d.p4; prevCum += (d.p1 + d.p2 + d.p3); }
                    
                    let statusObj = determineStatus(d.p1, d.p2, d.p3, d.p4, d.actual, currentQuarter, isLastMonthOfQuarter);
                    let displayPct = pCum > 0 ? (d.actual / pCum) * 100 : (prevCum > 0 ? (d.actual / prevCum) * 100 : 0);

                    let pieColor = "#16a34a"; 
                    if (statusObj.includes("ล่าช้า")) pieColor = "#eab308"; 
                    if (statusObj.includes("เสี่ยง")) pieColor = "#ef4444"; 
                    if (pCum === 0) pieColor = "#cbd5e1";

                    pieChartsContainer.innerHTML += `
                        <div class="group bg-gradient-to-b from-purple-100 to-purple-50 rounded-[1.5rem] shadow-md border border-purple-200 p-6 flex flex-col justify-between transform transition-all duration-500 hover:-translate-y-2 hover-glow w-full">
                            <h3 class="text-lg font-bold mb-4 flex items-center text-purple-950">
                                <svg class="w-6 h-6 mr-2 text-purple-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"></path></svg>
                                ผลการดำเนินงาน (${unit})
                            </h3>
                            <div class="flex-grow flex items-center justify-center my-6">
                                <div id="pie-chart-kpi-${idx}" class="conic-chart w-56 h-56 rounded-full relative flex items-center justify-center shadow-[inset_0_2px_15px_rgba(0,0,0,0.15)]" style="background: conic-gradient(#e2e8f0 0% 100%);">
                                    <div class="w-40 h-40 bg-white rounded-full flex flex-col items-center justify-center z-10 shadow-lg border-4 border-purple-50 transform transition-transform duration-500 group-hover:scale-105">
                                        <span class="text-4xl font-extrabold text-purple-950 transition-all">${percentCum}%</span>
                                        <span class="text-xs font-bold text-purple-500 mt-1">เทียบเป้าหมายรวม</span>
                                    </div>
                                </div>
                            </div>
                            <div class="mt-4 flex flex-col items-center text-center w-full">
                                <p class="text-sm text-purple-800 font-bold mb-3">สถานะภาพรวมล่าสุด (ไตรมาสที่ <span class="display-quarter">${currentQuarter}</span>)</p>
                                <div class="inline-flex items-center justify-center px-4 py-2.5 rounded-2xl text-base font-bold border-2 shadow-sm w-full bg-white leading-tight transition-colors ${getStatusStyles(statusObj)}">
                                    ${pCum > 0 ? `${statusObj} (${displayPct > 100 ? 100 : displayPct.toFixed(2)}%)` : statusObj}
                                </div>
                            </div>
                        </div>
                    `;
                    pieAnimations.push({ id: `pie-chart-kpi-${idx}`, color: pieColor, pct: percentCum });
                });

                if (budgetRows.length > 0) {
                    const bObj = budgetRows[0];
                    const bPercentCum = bObj.target > 0 ? ((bObj.actual / bObj.target) * 100).toFixed(2) : "0.00";
                    let bCum = 0, bPrevCum = 0;
                    if (currentQuarter >= 1) { bCum += bObj.planQ1; bPrevCum = 0; }
                    if (currentQuarter >= 2) { bCum += bObj.planQ2; bPrevCum += bObj.planQ1; }
                    if (currentQuarter >= 3) { bCum += bObj.planQ3; bPrevCum += (bObj.planQ1 + bObj.planQ2); }
                    if (currentQuarter >= 4) { bCum += bObj.planQ4; bPrevCum += (bObj.planQ1 + bObj.planQ2 + bObj.planQ3); }

                    tbody.innerHTML += `
                        <tr class="group/row border-b border-slate-100 hover:bg-cyan-50/50 transition-colors duration-300">
                            <td class="px-6 py-5"><div class="leading-relaxed ${nameStyle} group-hover/row:translate-x-1 transition-transform duration-300">${displayName}</div></td>
                            <td class="px-4 py-5 text-center text-slate-500 font-medium">${act.unit}</td>
                            <td class="px-4 py-5 text-right font-bold text-slate-700">${formatAutoDecimal(act.target)}</td>
                            <td class="px-4 py-5 text-right font-extrabold text-blue-700">${formatAutoDecimal(act.actual)}</td>
                            <td class="px-6 py-5">${progressHtml}</td>
                            <td class="px-6 py-5 text-center">
                                <span class="inline-flex items-center px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap ${getStatusStyles(act.status)} group-hover/row:shadow-md transition-all">${act.status}</span>
                            </td>
                        </tr>
                    `;
                });

                setTimeout(() => {
                    document.querySelectorAll('#table-body .bar-chart-col').forEach(bar => { bar.style.height = bar.getAttribute('data-h') + '%'; });
                    document.querySelectorAll('#table-body .bar-chart-col-text').forEach(textEl => { textEl.style.left = textEl.getAttribute('data-left') + '%'; });
                }, 50);

                // -- 8. ปัญหาและอุปสรรค --
                if (viewLevel === 'SINGLE') {
                    let issuesHtml = '';
                    
                    const problematicActivities = tableActivities.filter(a => 
                        (a.status && (a.status.includes("ล่าช้า") || a.status.includes("เสี่ยง") || a.status.includes("ยังไม่ดำเนินการ"))) || 
                        (a.issue && a.issue.trim() !== "")
                    );
                    
                    if (problematicActivities.length > 0) {
                        issuesHtml += `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;
                        problematicActivities.forEach(act => {
                            const issueText = act.issue && act.issue.trim() !== "" ? act.issue : "อยู่ระหว่างตรวจสอบและรวบรวมสาเหตุการดำเนินงานจาก สำนัก/กอง ที่รับผิดชอบโครงการ";
                            
                            let statusColor = "text-slate-600 bg-slate-50 border-slate-200";
                            if (act.status.includes("เสี่ยง")) statusColor = "text-red-700 bg-red-50 border-red-200";
                            else if (act.status.includes("ล่าช้า")) statusColor = "text-yellow-700 bg-yellow-50 border-yellow-200";
                            else if (act.status.includes("ยังไม่ดำเนินการ") || act.status.includes("ไม่มี")) statusColor = "text-white bg-red-600 border-red-800 shadow-sm animate-pulse";
                            
                            let displayName = act.name;
                            if (act.isKPI && viewLevel === 'SINGLE') {
                                displayName = act.name.replace("(KPI)", '<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold bg-blue-100 text-blue-800 mr-1">(KPI)</span>');
                            }

                            issuesHtml += `
                                <div class="border border-rose-100 rounded-2xl p-5 bg-white/60 backdrop-blur-sm flex flex-col transform transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_10px_20px_-5px_rgba(225,29,72,0.15)] hover:bg-white hover:border-rose-200">
                                    <div class="mb-3"><span class="text-xs font-bold px-3 py-1.5 rounded-full border ${statusColor}">${act.status}</span></div>
                                    <h5 class="text-sm font-bold text-rose-950 mb-3 leading-relaxed">${displayName}</h5>
                                    <div class="bg-rose-50/80 p-4 rounded-xl border border-rose-100/50 flex-grow">
                                        <p class="text-sm text-rose-900 leading-relaxed"><span class="font-semibold text-rose-950">สาเหตุ/อุปสรรค:</span> <br> ${issueText}</p>
                                    </div>
                                </div>
                            `;
                        });
                        issuesHtml += `</div>`;
                    } else {
                        issuesHtml = `<div class="bg-white/80 backdrop-blur-sm p-6 rounded-2xl border border-rose-100 text-center text-rose-500 font-medium shadow-sm">ไม่พบปัญหาหรือความเสี่ยงในการดำเนินงาน ณ ปัจจุบัน ทุกรายการดำเนินการได้ตามแผน</div>`;
                    }
                    document.getElementById('issues-container').innerHTML = issuesHtml;
                }

            } catch (error) {
                console.error("Error in renderDashboard:", error);
            }
        }
    </script>
</body>
</html>
