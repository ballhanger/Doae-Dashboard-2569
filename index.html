<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - กรมส่งเสริมการเกษตร 2569</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Sarabun', 'sans-serif'] },
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        body { font-family: 'Sarabun', sans-serif; background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); color: #1e293b; min-height: 100vh; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in-up { animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .conic-chart { transition: background 1.2s cubic-bezier(0.22, 1, 0.36, 1); }
        .bar-chart-col { transition: height 1.2s cubic-bezier(0.34, 1.56, 0.64, 1); width: 100%; }
        .progress-bar-fill { transition: width 1.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .hide-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
        .hide-scroll::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.6); border-radius: 10px; }
    </style>
</head>
<body class="p-4 sm:p-6 lg:p-8 text-slate-800">
    
    <div class="max-w-7xl mx-auto">
        <header class="relative z-[100] mb-12 fade-in-up">
            <div class="flex flex-col md:flex-row md:justify-between md:items-start gap-4 mb-6">
                <div class="text-center md:text-left flex-1 min-w-0">
                    <h1 class="text-2xl md:text-3xl lg:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-[#059669] to-[#0D9488] drop-shadow-md leading-tight mb-2">Dashboard รายงานความก้าวหน้าการดำเนินงานโครงการ</h1>
                    <h2 class="flex flex-col sm:flex-row sm:items-baseline gap-2 sm:gap-3 justify-center md:justify-start">
                        <span class="text-lg md:text-xl font-extrabold text-[#1E3A8A]">ประจำปีงบประมาณ พ.ศ. 2569</span>
                        <span class="text-xl md:text-2xl lg:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-[#059669] to-[#0D9488]">กรมส่งเสริมการเกษตร</span>
                    </h2>
                </div>
                <div id="custom-dropdown-container" class="w-full md:w-[400px] relative z-50">
                    <button id="dropdown-btn" onclick="toggleDropdown()" class="w-full bg-white border text-slate-800 font-extrabold py-4 px-5 rounded-2xl shadow-lg flex justify-between items-center text-left">
                        <span id="dropdown-text" class="truncate block w-full">กำลังโหลดสารบัญ...</span>
                        <svg id="dropdown-icon" class="w-6 h-6 text-[#059669] transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div id="dropdown-menu" class="hidden absolute z-[999] w-full mt-2 bg-white rounded-2xl shadow-2xl border overflow-hidden">
                        <ul id="dropdown-list" class="max-h-[60vh] overflow-y-auto hide-scroll flex flex-col"></ul>
                    </div>
                </div>
            </div>
            <div class="bg-[#FFEDD5] rounded-2xl shadow-md border px-6 py-4 w-full flex items-center">
                <h3 id="display-project-name" class="text-lg md:text-xl font-bold text-[#1E3A8A] w-full text-center">กำลังเชื่อมต่อข้อมูล...</h3>
            </div>
        </header>

        <div id="budget-cards-container" class="hidden fade-in-up delay-100 mb-10"></div>
        <div id="kpi-cards-container" class="flex flex-col gap-4 mb-16 fade-in-up delay-200"></div>

        <div id="pie-charts-container" class="hidden flex flex-wrap justify-center gap-8 mb-16 fade-in-up delay-300 w-full max-w-[1400px] mx-auto"></div>

        <div id="bar-chart-main-container" class="hidden fade-in-up delay-300 bg-white rounded-[2rem] shadow-sm border p-6 mb-10 overflow-hidden">
            <h3 class="text-xl font-extrabold mb-4 border-b pb-4 flex items-center">ผลการดำเนินงานรวม สะสมรายไตรมาส</h3>
            <div id="bar-legend-container" class="flex flex-wrap justify-center gap-4 mb-4 text-sm font-bold"></div>
            <div class="overflow-x-auto hide-scroll"><div id="combined-bar-chart-container" class="h-[400px] flex justify-between items-end px-4"></div></div>
        </div>

        <div id="table-main-container" class="hidden fade-in-up delay-300 bg-white rounded-[2rem] shadow-sm border overflow-hidden mb-10">
            <div class="p-6 bg-slate-50 border-b"><h3 class="text-lg font-bold">ติดตามสถานะ...</h3></div>
            <div class="overflow-x-auto"><table class="w-full text-sm text-left"><thead class="bg-slate-100 uppercase"><tr><th class="px-6 py-5 text-center">รายการ</th><th class="px-4 py-5 text-center">หน่วยนับ</th><th class="px-4 py-5 text-center">เป้าหมาย</th><th class="px-4 py-5 text-center">ผลงานสะสม</th><th class="px-6 py-5 text-center">ความก้าวหน้า</th><th class="px-6 py-5 text-center">สถานะปัจจุบัน</th></tr></thead><tbody id="table-body"></tbody></table></div>
        </div>

        <div id="issues-main-container" class="hidden fade-in-up delay-300 bg-white rounded-[2rem] shadow-sm border p-6 mb-12">
            <h3 class="text-lg font-bold mb-6 border-b pb-4">ปัญหาและอุปสรรคในการดำเนินงาน</h3>
            <div id="issues-container"></div>
        </div>
    </div>

    <script>
        const MASTER_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRzugFLo6mVzCbdo35AtXw_M7MDRuVbxGPk9oU_Q8n1C0jB1SAMkRtRinn7gUEUS-d_FrcQzbkEKWvx/pub?gid=0&single=true&output=csv";
        let MASTER_INDEX = [];
        const today = new Date();
        const currentMonth = today.getMonth() + 1;
        let currentQuarter = (currentMonth >= 10) ? 1 : (currentMonth <= 3) ? 2 : (currentMonth <= 6) ? 3 : 4;
        let isLastMonthOfQuarter = [12, 3, 6, 9].includes(currentMonth);

        const kpiThemes = [
            { id: 'emerald', bg: 'bg-emerald-200', text: 'text-emerald-900', ring: '#10B981', badge: 'bg-[#064E3B]', card: 'bg-emerald-50' },
            { id: 'blue', bg: 'bg-blue-200', text: 'text-blue-900', ring: '#3B82F6', badge: 'bg-[#1E3A8A]', card: 'bg-blue-50' },
            { id: 'purple', bg: 'bg-purple-200', text: 'text-purple-900', ring: '#8B5CF6', badge: 'bg-[#4C1D95]', card: 'bg-purple-50' },
            { id: 'pink', bg: 'bg-pink-200', text: 'text-pink-900', ring: '#EC4899', badge: 'bg-[#831843]', card: 'bg-pink-50' },
            { id: 'cyan', bg: 'bg-cyan-200', text: 'text-cyan-900', ring: '#06B6D4', badge: 'bg-[#164E63]', card: 'bg-cyan-50' }
        ];

        const statusConfig = {
            'เป็นไปตามแผน': { color: '#10B981', badge: 'bg-[#064E3B]', sub: 'ร้อยละผลงาน ≥ 100' },
            'ล่าช้า': { color: '#EAB308', badge: 'bg-[#854D0E]', sub: 'ร้อยละ 50 - 99' },
            'เสี่ยง': { color: '#EF4444', badge: 'bg-[#7F1D1D]', sub: 'ต่ำกว่าร้อยละ 50' },
            'ยังไม่ดำเนินการ': { color: '#1E293B', badge: 'bg-[#0F172A]', sub: 'ผลงาน = 0' }
        };

        const formatMoney = (n) => new Intl.NumberFormat('th-TH', { minimumFractionDigits: 2 }).format(n);
        const formatAuto = (n) => n % 1 !== 0 ? formatMoney(n) : new Intl.NumberFormat('th-TH').format(n);

        function determineStatus(p1, p2, p3, p4, act, q, isLast) {
            let pCum = 0, prevCum = 0;
            if (q>=1) { pCum += p1; } if (q>=2) { pCum += p2; prevCum += p1; } if (q>=3) { pCum += p3; prevCum += (p1+p2); } if (q>=4) { pCum += p4; prevCum += (p1+p2+p3); }
            if (act === 0) return "ยังไม่ดำเนินการ";
            if (act >= pCum) return "เป็นไปตามแผน";
            if (!isLast && q > 1 && act >= prevCum) return "เป็นไปตามแผน";
            let pct = pCum > 0 ? (act / pCum) * 100 : 0;
            return pct >= 50 ? "ล่าช้า" : "เสี่ยง";
        }

        function generateMarkers(target, p1, p2, p3) {
            if (target <= 0) return '';
            let h = '';
            [ {v: p1, l: 'Q1'}, {v: p1+p2, l: 'Q2'}, {v: p1+p2+p3, l: 'Q3'} ].forEach(q => {
                let deg = (q.v / target) * 360;
                if (deg > 0 && deg < 360) {
                    h += `<div class="absolute inset-0 pointer-events-none" style="transform: rotate(${deg}deg)">
                            <div class="absolute top-[-8px] left-1/2 -translate-x-1/2 w-1.5 h-6 bg-slate-800 rounded-full"></div>
                            <div class="absolute top-[-36px] left-1/2 -translate-x-1/2" style="transform: rotate(-${deg}deg)">
                                <div class="bg-slate-800 text-white text-[11px] font-black px-2 py-0.5 rounded shadow border border-slate-600">${q.l}</div>
                            </div>
                          </div>`;
                }
            });
            return h;
        }

        async function loadProject(idx) {
            const item = MASTER_INDEX[idx];
            document.getElementById('dropdown-text').textContent = item.name.replace(/^- /, '');
            const data = await fetchCSV(item.url);
            
            let flat = data.map(r => ({
                name: r["โครงการ/กิจกรรม"] || "",
                unit: r["หน่วยนับ"] || "ราย",
                target: parseFloat(String(r["เป้าหมาย"]).replace(/,/g,'')) || 0,
                actual: parseFloat(String(r["ผลการดำเนินงานสะสม"]).replace(/,/g,'')) || 0,
                p1: parseFloat(String(r["แผนไตรมาส 1"]).replace(/,/g,'')) || 0,
                p2: parseFloat(String(r["แผนไตรมาส 2"]).replace(/,/g,'')) || 0,
                p3: parseFloat(String(r["แผนไตรมาส 3"]).replace(/,/g,'')) || 0,
                p4: parseFloat(String(r["แผนไตรมาส 4"]).replace(/,/g,'')) || 0,
                status: (r["สถานะไตรมาส "+currentQuarter] || "").replace(/[🔴🟡🟢⚫⚪❌]/g, '').trim()
            }));

            renderUI(flat);
        }

        function renderUI(rows) {
            const budget = rows.find(r => r.name.includes("งบประมาณ"));
            const kpis = rows.filter(r => r.name.includes("(KPI)"));

            // 1. Budget Card
            const bc = document.getElementById('budget-cards-container');
            if (budget) {
                const pct = budget.target > 0 ? (budget.actual/budget.target)*100 : 0;
                bc.innerHTML = `<div class="bg-gradient-to-br from-[#FDFBF7] to-[#E8D0A5] rounded-[2rem] p-8 shadow-lg border border-[#D4AF37]/30">
                    <h3 class="text-xl font-extrabold mb-6 text-[#8B6508]">งบประมาณทั้งปี (พรบ.)</h3>
                    <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
                        <div class="lg:col-span-2 bg-white rounded-2xl p-6 shadow-sm flex flex-col items-center">
                            <p class="text-slate-500 font-bold mb-2">งบประมาณที่ได้รับจัดสรร</p>
                            <h2 class="text-4xl font-black text-[#1E3A8A]">${formatMoney(budget.target)} <span class="text-sm">บาท</span></h2>
                        </div>
                        <div class="lg:col-span-2 bg-white rounded-2xl p-6 shadow-sm flex flex-col items-center">
                            <p class="text-emerald-600 font-bold mb-2">ผลการเบิกจ่ายสะสม</p>
                            <h2 class="text-4xl font-black text-[#059669]">${formatMoney(budget.actual)} <span class="text-sm">บาท</span></h2>
                        </div>
                        <div class="lg:col-span-1 bg-white rounded-2xl p-6 shadow-sm flex flex-col items-center">
                            <p class="text-amber-600 font-bold mb-2">ร้อยละ</p>
                            <h2 class="text-4xl font-black text-[#D97706]">${pct.toFixed(2)}%</h2>
                        </div>
                    </div>
                </div>`;
                bc.classList.remove('hidden');
            }

            // 2. KPI Cards Top
            const kc = document.getElementById('kpi-cards-container');
            kc.innerHTML = '';
            kpis.forEach((k, i) => {
                const theme = kpiThemes[i % kpiThemes.length];
                const pct = k.target > 0 ? (k.actual/k.target)*100 : 0;
                kc.innerHTML += `<div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
                    <div class="${theme.bg} rounded-2xl p-6 shadow-sm flex flex-col items-center"><p class="font-bold opacity-70 mb-2">เป้าหมายโครงการ (${k.unit})</p><h2 class="text-4xl font-black">${formatAuto(k.target)}</h2></div>
                    <div class="bg-gradient-to-br from-slate-700 to-slate-900 text-white rounded-2xl p-6 shadow-sm flex flex-col items-center"><p class="font-bold opacity-70 mb-2">ผลการดำเนินงาน</p><h2 class="text-4xl font-black">${formatAuto(k.actual)}</h2></div>
                    <div class="bg-white rounded-2xl p-6 shadow-sm flex flex-col items-center border"><p class="text-slate-500 font-bold mb-2">ร้อยละการดำเนินงาน</p><h2 class="text-4xl font-black text-slate-800">${pct.toFixed(2)}%</h2></div>
                </div>`;
            });

            // 3. Status Donut (พระเอก)
            const pc = document.getElementById('pie-charts-container');
            pc.innerHTML = ''; pc.classList.remove('hidden');

            const allStatusItems = budget ? [budget, ...kpis] : kpis;
            allStatusItems.forEach((item, i) => {
                const isBudget = item.name.includes("งบประมาณ");
                const theme = isBudget ? { bg: 'bg-[#FDFBF7]', text: 'text-[#8B6508]', ring: '#D4AF37' } : kpiThemes[(i-(budget?1:0)) % kpiThemes.length];
                // สีพื้นหลังลดความเข้ม 25% (ใช้สไตล์ opacity)
                const bgClass = isBudget ? 'bg-[#fefce8]' : theme.card;
                
                const pctYearly = item.target > 0 ? (item.actual/item.target)*100 : 0;
                const pctCurrent = getPctVsCurrentPlan(item.p1, item.p2, item.p3, item.p4, item.actual, currentQuarter, isLastMonthOfQuarter);
                const stat = determineStatus(item.p1, item.p2, item.p3, item.p4, item.actual, currentQuarter, isLastMonthOfQuarter);
                const cfg = statusConfig[stat] || statusConfig['ยังไม่ดำเนินการ'];

                pc.innerHTML += `<div class="w-full md:w-[400px] ${bgClass} rounded-[2.5rem] p-8 shadow-xl border-white border-2 flex flex-col items-center relative transition-transform hover:-translate-y-2">
                    <div class="mb-6 w-full text-center">
                        <h4 class="text-xl font-black ${theme.text} mb-1">สถานะ${isBudget?'การใช้จ่ายงบประมาณ':'ผลการดำเนินงาน'} (${item.unit})</h4>
                        <p class="text-lg font-black text-black flex justify-center items-center">📍 <span>ณ ไตรมาสที่ ${currentQuarter}</span></p>
                    </div>
                    <div class="relative w-64 h-64 mb-10">
                        <div id="ring-${i}" class="w-full h-full rounded-full conic-chart bg-[#f1f5f9] shadow-inner"></div>
                        <div class="absolute inset-[2.2rem] bg-white rounded-full flex flex-col items-center justify-center shadow-md border-4 border-white/50">
                            <span class="text-5xl font-black text-slate-800">${pctCurrent.toFixed(2)}</span>
                            <span class="text-2xl font-bold text-slate-400 mt-1">%</span>
                        </div>
                        ${generateMarkers(item.target, item.p1, item.p2, item.p3)}
                    </div>
                    <div class="w-full ${cfg.badge} rounded-2xl p-4 text-center border-2 border-white/20 shadow-lg">
                        <div class="text-white text-xl font-black mb-1">● ${stat}</div>
                        <div class="text-white/90 text-sm font-bold">${cfg.sub}</div>
                    </div>
                </div>`;
                
                setTimeout(() => {
                    const el = document.getElementById(`ring-${i}`);
                    if (pctYearly > 0) el.style.background = `conic-gradient(${cfg.color} 0% ${Math.min(pctYearly, 100)}%, #f1f5f9 ${Math.min(pctYearly, 100)}% 100%)`;
                }, 200);
            });

            // Update Table
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            rows.filter(r => !r.name.includes("งบประมาณ")).forEach((r, idx) => {
                const p = r.target > 0 ? (r.actual/r.target)*100 : 0;
                tbody.innerHTML += `<tr class="border-b ${idx%2===0?'bg-white':'bg-slate-50'}">
                    <td class="px-6 py-4 font-bold">${r.name.replace("(KPI)", "")}</td>
                    <td class="px-4 py-4 text-center">${r.unit}</td>
                    <td class="px-4 py-4 text-center">${formatAuto(r.target)}</td>
                    <td class="px-4 py-4 text-center text-blue-600 font-bold">${formatAuto(r.actual)}</td>
                    <td class="px-6 py-4"><div class="w-full bg-slate-200 h-3 rounded-full overflow-hidden"><div class="bg-blue-500 h-full" style="width:${p}%"></div></div><p class="text-[10px] text-right">${p.toFixed(2)}%</p></td>
                    <td class="px-6 py-4 text-center"><span class="px-3 py-1 rounded-full text-xs font-bold ${getStatusStyles(r.status)}">${r.status}</span></td>
                </tr>`;
            });
        }

        async function fetchCSV(url) {
            return new Promise(res => Papa.parse(url, { download:true, header:true, complete: r => res(r.data) }));
        }

        function getPctVsCurrentPlan(p1, p2, p3, p4, actual, q, isLast) {
            let pCum = 0, prevCum = 0;
            if(q>=1) pCum += p1; if(q>=2) { pCum += p2; prevCum += p1; } if(q>=3) { pCum += p3; prevCum += (p1+p2); } if(q>=4) { pCum += p4; prevCum += (p1+p2+p3); }
            if(!isLast && q>1) return prevCum > 0 ? (actual/prevCum)*100 : (actual>0?100:0);
            return pCum > 0 ? (actual/pCum)*100 : (actual>0?100:0);
        }

        function getStatusStyles(s) {
            if (s.includes("แผน")) return "bg-emerald-100 text-emerald-700";
            if (s.includes("ล่าช้า")) return "bg-yellow-100 text-yellow-700";
            if (s.includes("เสี่ยง")) return "bg-red-100 text-red-700";
            return "bg-slate-100 text-slate-700";
        }

        function toggleDropdown() { document.getElementById('dropdown-menu').classList.toggle('hidden'); }

        document.addEventListener('DOMContentLoaded', async () => {
            const data = await fetchCSV(MASTER_CSV_URL);
            MASTER_INDEX = data.map(r => ({ name: r["ชื่อโครงการ/กิจกรรม"], url: r["ลิงก์ CSV"] }));
            const list = document.getElementById('dropdown-list');
            MASTER_INDEX.forEach((m, i) => {
                const li = document.createElement('li');
                li.className = "px-5 py-3 border-b hover:bg-slate-50 cursor-pointer font-bold";
                li.textContent = m.name;
                li.onclick = () => { loadProject(i); toggleDropdown(); };
                list.appendChild(li);
            });
            loadProject(0);
        });
    </script>
</body>
</html>
